<!--
  Safety Auth remote Wazuh Agent configuration for Ubuntu/EC2.

  Replace KALI_WAZUH_MANAGER_IP_OR_TAILSCALE_DNS with the Kali Wazuh Manager
  LAN IP, Tailscale IP, or Tailscale DNS name before installing this file to:

    /var/ossec/etc/ossec.conf

  This file contains no real secrets.
-->
<ossec_config>
  <client>
    <server>
      <address>KALI_WAZUH_MANAGER_IP_OR_TAILSCALE_DNS</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux,docker,safety-auth,remote</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>KALI_WAZUH_MANAGER_IP_OR_TAILSCALE_DNS</manager_address>
      <port>1515</port>
      <agent_name>safety-auth-ubuntu-ec2-agent</agent_name>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!--
    Native Ubuntu/EC2 agent reads Docker json-file logs from the host.
    Safety Auth writes audit JSON to stdout, and Docker stores it in these files.
  -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/lib/docker/containers/*/*-json.log</location>
  </localfile>

  <!--
    Optional fallback only if the host uses a mirrored log file.
    Do not enable this together with the Docker json-file path above, otherwise
    the same Safety Auth event can generate duplicate Wazuh alerts.

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/safety-auth-docker/docker-containers.log</location>
  </localfile>
  -->

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
