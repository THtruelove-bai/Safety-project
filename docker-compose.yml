services:
  # ===================== SAFETY AUTH SERVER =====================
  safety-auth:
    build: ./safety-auth
    container_name: safety-auth
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WAZUH_API_URL=${WAZUH_API_URL}
      - WAZUH_API_USERNAME=${WAZUH_API_USERNAME}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD}
      - WAZUH_API_TLS_REJECT_UNAUTHORIZED=${WAZUH_API_TLS_REJECT_UNAUTHORIZED}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - safety-net

  # ===================== DATABASE =====================
  postgres:
    image: postgres:16
    container_name: safety-postgres
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - safety-net

  # ===================== REDIS =====================
  redis:
    image: redis:7
    container_name: safety-redis
    platform: linux/amd64
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - safety-net

  # ===================== NGINX REVERSE PROXY =====================
  nginx:
    image: nginx:latest
    container_name: safety-nginx
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - safety-auth
    networks:
      - safety-net

# ===================== GLOBAL CONFIGURATION =====================
networks:
  safety-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
